# On the USB stick: podman's storage. Anything podman adds (NVIDIA's driver while installing) is
# kept in memory, since the stick's root filesystem, itself an overlay, can't hold container
# layers. The system the installers copy is a read-only store on the stick, which
# storage.rootful.conf.d/90-marah-os-stick.conf lists: Fedora's own drop-in would replace a list
# here.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
