# On the USB stick: the system the installers copy, stored read-only in the stick's root
# filesystem (build-iso.sh puts it in /var/lib/containers/storage there), which the live system
# sees at /run/rootfsbase. podman as root reads this file after Fedora's
# /usr/share/containers/storage.rootful.conf.d/00-vendor-rootful.conf and after
# /etc/containers/storage.conf, and a later file's list replaces an earlier one's (see
# containers-config(5), "Load Order"). So this list keeps Fedora's store and adds the stick's.
# The installer mounts this folder into its bootc container too.
[storage.options]
additionalimagestores = ["/usr/lib/containers/storage", "/run/rootfsbase/var/lib/containers/storage"]
