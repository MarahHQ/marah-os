name: Marah OS

# Marah OS: its images and its USB stick (README.md).
#
# - Images: ghcr.io/<owner>/marah-os:minimal (Containerfile) and :minimal-nvidia (the same plus
#   NVIDIA's driver, nvidia/). Built, checked and pushed every day, and after each Marah Launcher
#   release (MarahHQ/marah-launcher's package.yml starts this with the Marah Bot's token once the
#   release is published), so installed PCs get Fedora's fixes and the newest Marah Launcher (the
#   image installs the latest Marah Launcher release's rpm). They also get a dated tag, and on
#   an OS release a version tag (minimal-0.2.0).
# - An OS release: a run on a tag (v<version>), which release.yml starts on the tag Release
#   Please made. The images are built from the tag and tagged with the version, then the stick is
#   built, attached to the draft release, and the release is published.
# - The stick is one file, marah-os-x86_64-<version>.iso (version.txt; a test run's ends
#   -test.iso), or 1500 MB parts when it's over 2 GiB (GitHub's limit for a release file), each
#   with a .sha256. It's also this run's `marah-os-iso` artifact.
# - Test mode (by hand on a branch, the default): the images go under -test tags
#   (:minimal-test), which no PC follows, and the stick is only kept as an artifact for a few
#   days.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: images under -test tags no PC follows, the stick as an artifact only (not on an OS tag)"
        type: boolean
        default: true
      iso:
        description: Build the stick too (test runs; an OS release always builds it)
        type: boolean
        default: true
      marah-launcher:
        description: A Marah Launcher release tag to bundle instead of the latest (for example v0.2.0)
        type: string
        default: ""

# Each job asks for what it needs.
permissions: {}

# One run per kind at a time, so two runs never push the same tags at once.
concurrency:
  group: marah-os-${{ github.ref_type == 'tag' && github.ref_name || (inputs.test && 'test') || 'images' }}
  cancel-in-progress: false

env:
  # Test runs push under -test tags (":minimal-test"), which no PC follows.
  # An OS release when it runs on an OS tag.
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  SUFFIX: ${{ inputs.test && !startsWith(github.ref, 'refs/tags/v') && '-test' || '' }}
  BASE: quay.io/fedora/fedora-bootc:44

defaults:
  run:
    shell: bash

jobs:
  minimal:
    name: minimal image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: The launcher's paths are the ones this tree makes
        run: ./check-brand.sh

      - name: The Marah Launcher rpm
        env:
          GH_TOKEN: ${{ github.token }}
          # Marah Launcher's releases are public: the workflow's own token reads them.
          GH_REPO: MarahHQ/marah-launcher
          MARAH: ${{ inputs.marah-launcher }}
        run: |
          if [ -n "$RELEASE" ] && [ "$RELEASE" != "v$(cat version.txt)" ]; then
            echo "::error::the tag is $RELEASE, but version.txt says $(cat version.txt)"
            exit 1
          fi
          if [ -z "$MARAH" ] && ! gh api "repos/$GH_REPO/releases/latest" >/dev/null 2>&1; then
            echo "::error::No Marah Launcher release is published yet: release Marah Launcher first, then run this again"
            exit 1
          fi
          ./fetch-marah-launcher.sh ${MARAH:+"$MARAH"}

      - name: Build
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/marah-os" >> "$GITHUB_ENV"
          IMAGE="ghcr.io/$owner/marah-os" REPO="$GITHUB_REPOSITORY" \
            ./build-image.sh "ghcr.io/$owner/marah-os:minimal$SUFFIX"

      - name: Check the image
        run: |
          sudo podman run --rm --entrypoint /usr/bin/bash "$IMAGE:minimal$SUFFIX" -c '
            set -e
            for tool in gamescope cage nmcli bluetoothctl pactl bootc rpm-ostree mokutil xprop xdotool marah-launcher marah-session; do
              command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
            done
            for lib in libmpv.so.2 libarchive.so.13 libxkbcommon-x11.so.0 libvulkan.so.1 libpulse.so.0 libXss.so.1 libasound.so.2 libEGL.so.1; do
              ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }
            done
            systemctl is-enabled greetd.service NetworkManager.service bluetooth.service chronyd.service marah-os-update.timer
            test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = masked
            grep -q "/usr/bin/marah-session" /etc/greetd/config.toml
            grep -q systemd.gpt_auto=0 /usr/lib/bootc/install/50-marah-os.toml
            test -s /usr/lib/marah-os/release
            grep -q "^ghcr.io/.*/marah-os$" /usr/lib/marah-os/image
            test -f /usr/share/polkit-1/rules.d/50-marah-os.rules
            grep -q "^NAME=\"Marah OS\"" /usr/lib/os-release
            cat /usr/lib/marah-os/release
            marah-launcher --version
            marah-launcher --supports gamescope'

      - name: Push
        id: push
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="$IMAGE:minimal$SUFFIX"
          refs="$img"
          # Dated and version tags keep earlier versions at hand (not for test runs).
          if [ -z "$SUFFIX" ]; then
            sudo podman tag "$img" "$IMAGE:minimal-$(date -u +%Y%m%d)"
            refs="$refs $IMAGE:minimal-$(date -u +%Y%m%d)"
            if [ -n "$RELEASE" ]; then VERSION=${RELEASE#v}; sudo podman tag "$img" "$IMAGE:minimal-$VERSION"; refs="$refs $IMAGE:minimal-$VERSION"; fi
          fi
          for ref in $refs; do
            for try in 1 2 3; do sudo podman push --digestfile /tmp/digest "$ref" && break; [ "$try" = 3 ] && exit 1; sleep 30; done
          done
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      # The installers and installed PCs pull without logging in, so a private package fails
      # every install. GitHub creates packages private, and only the web settings page can
      # change that.
      - name: Can anyone pull it?
        run: |
          if ! skopeo inspect --no-creds --raw "docker://$IMAGE:minimal$SUFFIX" >/dev/null; then
            echo "::error::$IMAGE:minimal$SUFFIX can't be pulled without logging in: make the marah-os package public in its settings on GitHub (Danger Zone → Change visibility)"
            exit 1
          fi

  # NVIDIA's driver on top of the minimal edition just pushed, for its exact kernel: only the
  # driver's layers differ, so that's all an NVIDIA PC downloads.
  minimal-nvidia:
    name: NVIDIA image
    needs: minimal
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          DIGEST: ${{ needs.minimal.outputs.digest }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/marah-os" >> "$GITHUB_ENV"
          core="ghcr.io/$owner/marah-os@$DIGEST"
          sudo podman pull "$core"
          kernel=$(sudo podman run --rm "$core" rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)
          # Universal Blue builds the modules for each new Fedora kernel within about a day; until
          # then NVIDIA PCs keep the previous :minimal-nvidia.
          if ! skopeo inspect --raw "docker://ghcr.io/ublue-os/akmods-nvidia-lts:main-44-$kernel" >/dev/null; then
            echo "::notice::No NVIDIA modules for kernel $kernel yet: :minimal-nvidia stays as it is"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo podman build --build-arg CORE="$core" --build-arg KERNEL="$kernel" -f nvidia/Containerfile \
            -t "ghcr.io/$owner/marah-os:minimal-nvidia$SUFFIX" .

      - name: Check the image
        if: env.SKIP != '1'
        run: |
          sudo podman run --rm --entrypoint /usr/bin/bash "$IMAGE:minimal-nvidia$SUFFIX" -c '
            set -e
            kver=$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" kernel-core)
            test "$(rpm -q --qf "%{VERSION}" kmod-nvidia)" = "$(rpm -q --qf "%{VERSION}" nvidia-driver)"
            find /usr/lib/modules/$kver -name "nvidia.ko*" | grep -q .
            grep -q nvidia-drm.modeset=1 /usr/lib/bootc/kargs.d/00-nvidia.toml
            if grep -l "^enabled=1" /etc/yum.repos.d/*nvidia* 2>/dev/null; then exit 1; fi
            systemctl is-enabled greetd.service marah-os-update.timer
            test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = masked
            test -s /usr/lib/marah-os/release
            marah-launcher --version
            marah-launcher --supports gamescope'

      - name: Push
        if: env.SKIP != '1'
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="$IMAGE:minimal-nvidia$SUFFIX"
          refs="$img"
          if [ -z "$SUFFIX" ]; then
            sudo podman tag "$img" "$IMAGE:minimal-nvidia-$(date -u +%Y%m%d)"
            refs="$refs $IMAGE:minimal-nvidia-$(date -u +%Y%m%d)"
            if [ -n "$RELEASE" ]; then VERSION=${RELEASE#v}; sudo podman tag "$img" "$IMAGE:minimal-nvidia-$VERSION"; refs="$refs $IMAGE:minimal-nvidia-$VERSION"; fi
          fi
          for ref in $refs; do
            for try in 1 2 3; do sudo podman push "$ref" && break; [ "$try" = 3 ] && exit 1; sleep 30; done
          done

      - name: Can anyone pull it?
        if: env.SKIP != '1'
        run: |
          if ! skopeo inspect --no-creds --raw "docker://$IMAGE:minimal-nvidia$SUFFIX" >/dev/null; then
            echo "::error::$IMAGE:minimal-nvidia$SUFFIX can't be pulled without logging in: make the marah-os package public in its settings on GitHub (Danger Zone → Change visibility)"
            exit 1
          fi

  iso:
    name: USB stick
    needs: minimal
    # An OS release, or by hand in test mode.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.iso && inputs.test)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Build the stick
        env:
          DIGEST: ${{ needs.minimal.outputs.digest }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # The very image the minimal job pushed, whatever was pushed since.
          core="ghcr.io/$owner/marah-os@$DIGEST"
          sudo podman pull "$core"
          # marah-os-x86_64-0.2.0.iso; a test run's is marah-os-x86_64-0.2.0-test.iso.
          iso="marah-os-x86_64-$(cat version.txt)$SUFFIX.iso"
          echo "ISO=$iso" >> "$GITHUB_ENV"
          ./make-iso.sh "$core" "out/$iso"

      - name: Checksums, and parts when it's over 2 GiB
        working-directory: out
        run: |
          iso=$ISO
          sha256sum "$iso" > "$iso.sha256"
          size=$(stat -c %s "$iso")
          echo "ISO: $size bytes"
          # GitHub release files must be under 2 GiB: a larger ISO goes as 1500 MB parts
          # (marah-os-x86_64-0.2.0.iso.part-aa, -ab, …), which the README shows how to join.
          if [ "$size" -gt 2147483648 ]; then
            split -b 1500M "$iso" "$iso.part-"
            rm "$iso"
            for part in "$iso".part-*; do sha256sum "$part" > "$part.sha256"; done
          fi
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marah-os-iso
          path: out/*
          if-no-files-found: error
          # A release attaches it right away; a test run keeps it a few days to try.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}
          compression-level: 0

  # The ISO (or its parts) and the checksums go on the draft, which is then published.
  publish:
    name: publish the release
    needs: [minimal, minimal-nvidia, iso]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marah-os-iso
          path: iso
      - name: Attach the stick and publish
        working-directory: iso
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l
          # The whole ISO's checksum stays when it was split into parts; each part has its own.
          for sum in ./*.sha256; do [ ! -e "${sum%.sha256}" ] || sha256sum -c "$sum"; done
          gh release upload "$RELEASE" ./* --clobber
          gh release edit "$RELEASE" --draft=false --latest
