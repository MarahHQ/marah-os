# The Marah OS menu theme (grub-theme/), when all its files are on this disk.
set marah_theme=($root)/themes/marah-os
set marah_whole=y
for f in background.png hint.png logo.png menu_c.png menu_e.png menu_ne.png menu_n.png menu_nw.png menu_se.png menu_s.png menu_sw.png menu_w.png select_c.png select_e.png select_ne.png select_n.png select_nw.png select_se.png select_s.png select_sw.png select_w.png theme.txt title.png; do
    if [ ! -f $marah_theme/$f ]; then set marah_whole=n; fi
done
if [ "$marah_whole" = y ]; then
    insmod all_video
    insmod gfxterm
    insmod png
    set gfxmode=1280x720,1280x800,1024x768,auto
    terminal_output gfxterm
    set theme=$marah_theme/theme.txt
fi
